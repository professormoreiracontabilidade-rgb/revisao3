<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz 3 - Questões 31 a 45</title><style>
:root{--azul:#0b4f8a;--azul2:#eaf4ff;--verde:#16834b;--vermelho:#c62828;--amarelo:#fff4c2;--texto:#102235}
*{box-sizing:border-box} body{margin:0;background:#f2f6fb;font-family:Arial,Helvetica,sans-serif;color:var(--texto)}
.app{max-width:760px;margin:auto;min-height:100vh;background:white;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--azul);color:white;padding:14px 16px}.brand{font-weight:800;font-size:18px}.sub{font-size:13px;opacity:.95;margin-top:3px}.progress{font-weight:700;margin-top:8px}
.screen{padding:18px 16px 110px;flex:1}.meta{background:var(--azul2);border-left:5px solid var(--azul);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-weight:700;line-height:1.35}.qtitle{font-size:23px;font-weight:900;color:var(--azul);margin:0 0 12px}.stem{white-space:pre-wrap;font-size:18px;line-height:1.48;margin-bottom:16px}.alt{display:block;width:100%;text-align:left;border:2px solid #c8d6e5;background:#fff;border-radius:12px;padding:13px 14px;margin:9px 0;font-size:17px;line-height:1.35}.alt.sel{border-color:var(--azul);background:var(--azul2)}.alt.correct{border-color:var(--verde);background:#eaf8f0}.alt.wrong{border-color:var(--vermelho);background:#ffeded}
.feedback{margin-top:14px;padding:12px;border-radius:10px;font-weight:800;display:none}.feedback.ok{display:block;background:#eaf8f0;color:#0e683b}.feedback.no{display:block;background:#ffeded;color:#9d1c1c}.confirm{width:100%;border:0;border-radius:12px;padding:15px;background:var(--azul);color:#fff;font-size:18px;font-weight:900;margin-top:14px}.confirm:disabled{opacity:.45}.resolution{font-size:18px;line-height:1.55;background:#f8fbff;border:1px solid #d9e7f4;border-radius:12px;padding:16px}.gabarito{font-size:23px;font-weight:900;color:var(--verde);margin-bottom:12px}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#fff;border-top:1px solid #d8e0e8;padding:10px 12px;display:flex;gap:8px}.nav{flex:1;border:0;border-radius:10px;padding:13px 8px;font-weight:800;font-size:15px;background:#e7eef6;color:#123}.nav.primary{background:var(--azul);color:#fff}.nav:disabled{opacity:.4}.done{text-align:center;padding:40px 15px}.done h2{color:var(--azul);font-size:28px}.score{font-size:24px;font-weight:900;margin:20px}
@media(max-width:480px){.stem,.resolution{font-size:17px}.alt{font-size:16px}.qtitle{font-size:21px}.brand{font-size:16px}}
</style></head><body><div class="app"><header class="top"><div class="brand">Curso de Contabilidade Professor Moreira</div><div class="sub">Revisão de Contabilidade Geral • FGV</div><div id="progress" class="progress"></div></header><main id="screen" class="screen"></main><footer class="footer"><button id="prev" class="nav">← Voltar</button><button id="restart" class="nav">↻ Reiniciar</button><button id="next" class="nav primary">Resolução →</button></footer></div><script>const DATA=[{"n": 31, "header": "FGV - AJ TRT13/TRT 13/Administrativa/Contabilidade/2022", "stem": "Uma sociedade empresária tem uma dívida operacional com vencimento em 14 meses.\nEssa dívida é apresentada no balanço patrimonial como passivo circulante.\n\nAssinale a opção que indica a circunstância que permite essa contabilização.", "alts": [["A", "O passivo é com o acionista controlador."], ["B", "O passivo decorre de uma dívida tributária."], ["C", "O passivo é com uma empresa em recuperação judicial."], ["D", "O passivo é com uma instituição financeira que tem o histórico de permitir a renegociação\nda dívida."], ["E", "O passivo é com fornecedores e a empresa que adquiriu o estoque tem ciclo operacional de\n15 meses."]], "answer": "E", "resolution": "Uma obrigação operacional pode ser circulante mesmo vencendo após 12 meses quando será liquidada dentro do ciclo operacional normal. Se o ciclo é 15 meses e a dívida com fornecedores vence em 14 meses, ela é circulante. Gabarito: E."}, {"n": 32, "header": "FGV - Eng (IMBEL)/IMBEL/Produção/2021", "stem": "No balanço patrimonial de uma empresa devem ser considerados diversos tipos de bens. As\nmáquinas industriais utilizadas nos processos produtivos são exemplos de bens", "alts": [["A", "de investimento."], ["B", "imobilizados."], ["C", "de venda."], ["D", "de renda."], ["E", "intangíveis."]], "answer": "B", "resolution": "Máquinas industriais usadas no processo produtivo são bens corpóreos mantidos para uso nas atividades da empresa: Ativo Imobilizado. Gabarito: B."}, {"n": 33, "header": "FGV - Ass Adm (TCE-PI)/TCE PI/2021", "stem": "Na apresentação do Balanço Patrimonial, as contas que compõem o grupo do Ativo\nrepresentam:", "alts": [["A", "aplicações de recursos e devem ter saldo total igual ao Passivo mais Patrimônio Líquido;"], ["B", "aplicações de recursos e a riqueza líquida da entidade;"], ["C", "aplicações de recursos financiadas por capital de terceiros;"], ["D", "origens de recursos e devem ter saldo total igual ao Passivo;"], ["E", "origens de recursos para uso nas atividades operacionais."]], "answer": "A", "resolution": "O Ativo representa aplicações de recursos e, pela equação patrimonial, seu total deve ser igual ao Passivo mais o Patrimônio Líquido. Gabarito: A."}, {"n": 34, "header": "FGV - Eng (FunSaúde CE)/FunSaúde CE/Produção/2021", "stem": "Relacione as descrições dos diferentes tipos de ativo constantes do balanço patrimonial de\numa empresa, às suas respectivas definições.\n\n 1. Ativo circulante\n 2. Ativo imobilizado\n 3. Intangível\n\n ( ) direitos que tenham por objeto bens incorpóreos destinados à manutenção da\n companhia ou exercidos com essa finalidade,\n\n ( ) direitos realizáveis no curso do exercício social subsequente e as aplicações de\n recursos em despesas do exercício seguinte\n\n ( ) direitos que tenham por objeto bens corpóreos destinados à manutenção das atividades\n da companhia ou da empresa\n\nAssinale a opção que indica a relação correta, segundo a ordem apresentada.", "alts": [["A", "1 – 3 – 2."], ["B", "2 – 1 – 3."], ["C", "2 – 3 – 1."], ["D", "3 – 1 – 2."], ["E", "3 – 2 – 1."]], "answer": "D", "resolution": "Bens incorpóreos destinados à manutenção = Intangível (3); direitos realizáveis no exercício seguinte = Circulante (1); bens corpóreos destinados à manutenção = Imobilizado (2). Sequência 3-1-2. Gabarito: D."}, {"n": 35, "header": "FGV - Tec (FunSaúde CE)/FunSaúde CE/Contabilidade/2021", "stem": "O Balanço Patrimonial apresenta os ativos, os passivos e o patrimônio líquido de uma\nentidade.\n\nO Ativo não Circulante é subdividido em", "alts": [["A", "Realizável a Longo Prazo, Investimentos, Imobilizado e Intangível."], ["B", "Realizável a Longo Prazo, Investimentos, Imobilizado e Diferido."], ["C", "Exigível a Longo Prazo, Permanente, Imobilizado e Diferido."], ["D", "Exigível a Longo Prazo, Permanente, Imobilizado e Intangível."], ["E", "Financeiro, Investimentos, Permanente e Diferido."]], "answer": "A", "resolution": "O Ativo Não Circulante é subdividido em Realizável a Longo Prazo, Investimentos, Imobilizado e Intangível. Gabarito: A."}, {"n": 36, "header": "FGV - Ana Esp (IMBEL)/IMBEL/Analista Contábil/2021", "stem": "Em 01/01/X1, uma entidade adquiriu um carro, para ser utilizado por seu diretor, por R$\n50.000, para pagamento no mês seguinte. No mesmo dia, ela pagou R$ 6.000 a título do seguro\nanual do carro.\n\nAssinale a opção que indica a movimentação no balanço patrimonial da entidade, na data.", "alts": [["A", "Ativo Imobilizado: +R$ 50.000; Passivo Circulante: +50.000."], ["B", "Passivo Circulante: +R$ 50.000; Patrimônio Líquido: +R$ 50.000."], ["C", "Ativo Circulante: +R$ 6.000; Ativo Imobilizado: +R$ 50.000; Passivo Circulante: +56.000."], ["D", "Ativo Circulante: +R$ 6.000; Ativo Imobilizado: +R$ 50.000; Passivo Circulante: +50.000;\nPatrimônio Líquido: +R$ 6.000."], ["E", "Ativo Circulante: -R$ 6.000; Ativo Imobilizado: +R$ 50.000; Passivo Circulante: +50.000;\nPatrimônio Líquido: -R$ 6.000."]], "answer": "A", "resolution": "O carro adquirido a prazo aumenta o Imobilizado em R$ 50.000 e o Passivo Circulante em R$ 50.000. O pagamento do seguro apenas troca Caixa por Despesa Antecipada dentro do Ativo Circulante, sem alterar seu total. Gabarito: A."}, {"n": 37, "header": "FGV - Ana Esp (IMBEL)/IMBEL/Analista Contábil/2021", "stem": "No balanço patrimonial de uma entidade, nos casos apresentados a seguir o ativo deve ser\nclassificado como circulante, á exceção de um. Assinale-o.", "alts": [["A", "É mantido essencialmente com o propósito de ser negociado."], ["B", "É utilizado na atividade operacional da empresa."], ["C", "Espera-se que, após a data do balanço, seja realizado em até doze meses."], ["D", "Espera-se que seja realizado ou vendido ou consumido no decurso normal do ciclo\noperacional da entidade."], ["E", "É caixa ou equivalente de caixa, a menos que sua troca ou uso para liquidação de passivo\nseja vedada durante os doze meses após a data do balanço."]], "answer": "B", "resolution": "Ser utilizado na atividade operacional não é, por si só, critério de Ativo Circulante; um bem usado na operação pode ser Imobilizado. As demais alternativas reproduzem critérios de classificação no circulante. Gabarito: B."}, {"n": 38, "header": "FGV - AJ (TJ AP)/TJ AP/Apoio Especializado/Contador/2024", "stem": "Uma empresa comercial apresentou os seguintes saldos.\n\n Saldos (em R$)\n Descrição\n Devedor Credor\nCaixa e equivalentes de caixa 2.000\nTributos a pagar (curto prazo) 15.000\nContas a receber (curto prazo) 10.000\nEstoques 20.000\nReserva de lucros 30.000\nCapital social 100.000\nTributos diferidos ativos 7.000\nAções em tesouraria 25.000\nOutros resultados abrangentes 10.000\nImobilizado 80.000\nInvestimentos em controladas 51.000\nFornecedores (curto prazo) 5.000\nEmpréstimos e Financiamentos (longo prazo) 30.000\nTributos diferidos passivos 5.000\n\nConsiderando-se as informações apresentadas, o saldo do:", "alts": [["A", "ativo circulante é de R$ 39.000;"], ["B", "passivo circulante é de R$ 25.000;"], ["C", "passivo não circulante é de R$ 30.000;"], ["D", "patrimônio líquido é de R$ 165.000;"], ["E", "ativo não circulante é de R$ 138.000."]], "answer": "E", "resolution": "Ativo Não Circulante = tributos diferidos ativos 7.000 + imobilizado 80.000 + investimentos em controladas 51.000 = R$ 138.000. Portanto, a alternativa correta é E."}, {"n": 39, "header": "FGV - ATRFB/SRFB/Geral/2023", "stem": "O balanço patrimonial representa o valor contábil de uma sociedade empresária em um\nmomento específico, como se fosse um retrato da empresa. Ele é composto por dois lados: no\nesquerdo estão os ativos da empresa; no direito são identificados os passivos e o capital dos\nacionistas. A definição contábil que fundamenta e descreve o balanço patrimonial é a seguinte:\n\nAtivos = Passivos + Patrimônio liquido\n\nConsidere as informações apresentadas a seguir sobre a sociedade empresária XPTO no ano de\n20XX.\n\nEmpresa XPTO 20XX\nCaixa e equivalentes 150\nFornecedores 150\nEmpréstimos 200\nAções Ordinárias 100\nReservas de Capital 250\nContas a receber 600\nEstoques 250\nBens, imóveis, fábricas e equipamentos 1500\nDívidas de longo prazo 500\nAções preferenciais 200\nAtivos intangíveis e outros 300\nDespesas a pagar 50\nImpostos diferidos 300\nReserva de lucros 400\nDepreciação acumulada 800\nAções em tesouraria 150\n\nNo período apresentado, os valores do Ativo Não-Circulante, do Passivo Circulante e do\nPatrimônio Líquido são, respectivamente,", "alts": [["A", "1000, 400 e 950."], ["B", "2300, 700 e 950."], ["C", "1000, 400 e 800."], ["D", "700, 700 e 950."], ["E", "700, 700 e 800."]], "answer": "C", "resolution": "ANC: imobilizado líquido 1.500 - 800 = 700; intangíveis 300; total 1.000. PC: fornecedores 150 + empréstimos 200 + despesas a pagar 50 = 400. PL: ações ordinárias 100 + reservas de capital 250 + ações preferenciais 200 + reserva de lucros 400 - ações em tesouraria 150 = 800. Gabarito: C."}, {"n": 40, "header": "FGV - Inv Pol (PC AM)/PC AM/4ª Classe/2022", "stem": "Uma sociedade empresária apresentava os seguintes saldos em 31/12/X0:\n\n • Caixa e equivalente de caixa: R$ 50.000.\n • Empréstimo a diretor com recebimento em 60 dias: R$ 25.000.\n • Receita de vendas recebida antecipadamente com prazo de realização de 70 dias: 55.000.\n • Estoques previstos para serem vendidos em 120 dias: 40.000,00.\n • Clientes, com recebimento em 180 dias: 60.000,00.\n • Aluguel pago antecipadamente, com apropriação linear e mensal por 24 meses: R$\n 48.000.\n • Terreno destinado à valorização: R$ 100.000.\n • Perdas estimadas com teste de recuperabilidade do terreno: R$ 10.000.\n • Perdas estimadas com desvalorização de estoques: R$ 4.000.\n • Perdas estimadas com crédito de liquidação duvidosa: R$ 3.000.\n\nCom base nos saldos acima, assinale a opção que indica o ativo circulante da empresa em\n31/12/X0.", "alts": [["A", "R$ 143.000."], ["B", "R$ 167.000."], ["C", "R$ 174.000."], ["D", "R$ 192.000."], ["E", "R$ 223.000."]], "answer": "B", "resolution": "AC: caixa 50.000 + estoques líquidos 36.000 + clientes líquidos 57.000 + parcela de 12 meses do aluguel antecipado 24.000 = R$ 167.000. O empréstimo a diretor é tratado como crédito com parte relacionada no RLP. Gabarito: B."}, {"n": 41, "header": "FGV - TAFE (Sefaz AM)/SEFAZ AM/2022", "stem": "Uma sociedade empresária apresentava os seguintes saldos em seu balanço patrimonial, em\n31/12/X0.\n\n • Caixa: R$20.000;\n • Estoque previsto para ser vendido em 390 dias: R$50.000;\n • Despesa de seguros dos veículos paga antecipadamente em 31/12/X0 e que será\n apropriada mensalmente de forma linear por dois anos: R$12.000;\n • Contas a receber em 120 dias: R$60.000;\n • Empréstimo a acionista com prazo de recebimento de 180 dias: R$15.000;\n • Veículos utilizados no transporte de funcionários com vida útil estimada em 5 anos:\n R$80.000;\n • Depreciação acumulada dos veículos: R$54.000;\n • Perdas estimadas nos estoques: R$5.000; e\n • Perdas estimadas com crédito de liquidação duvidosa: R$3.000.\n\nAssinale a opção que indica o ativo realizável a longo prazo da sociedade empresária, em\n31/12/X0:", "alts": [["A", "R$51.000."], ["B", "R$66.000."], ["C", "R$72.000."], ["D", "R$77.000."], ["E", "R$92.000."]], "answer": "B", "resolution": "RLP: estoque de 390 dias líquido da perda = 50.000 - 5.000 = 45.000; parcela do seguro após os 12 primeiros meses = 6.000; empréstimo a acionista = 15.000. Total = R$ 66.000. Gabarito: B."}, {"n": 42, "header": "FGV - Cont Dist (TJ TO)/TJ TO/Ciências Contábeis/2022", "stem": "Considere os saldos de natureza patrimonial no quadro a seguir, apresentados por uma\nentidade ao final de um dado exercício financeiro.\n\nAdiantamento de clientes R$ 5.000,00\nCapital a integralizar R$ 10.000,00\nCapital social R$ 30.000,00\nClientes R$ 10.000,00\nMáquinas e Equipamentos R$ 20.000,00\nFornecedores R$ 10.000,00\nMercadorias R$ 5.000,00\nReserva de lucros R$ 5.000,00\nSeguros a vencer R$ 2.000,00\nTributos a recuperar R$ 3.000,00\n\nA partir de tais informações, o valor do capital próprio da referida entidade ao final do exercício\né de:", "alts": [["A", "R$ 15.000,00;"], ["B", "R$ 25.000,00;"], ["C", "R$ 30.000,00;"], ["D", "R$ 35.000,00;"], ["E", "R$ 40.000,00."]], "answer": "B", "resolution": "Capital próprio corresponde ao Patrimônio Líquido: capital social 30.000 - capital a integralizar 10.000 + reserva de lucros 5.000 = R$ 25.000. Gabarito: B."}, {"n": 43, "header": "FGV - AJ TRT13/TRT 13/Administrativa/Contabilidade/2022", "stem": "Uma entidade apresentava, em seu Balanço Patrimonial, os seguintes saldos em seu ativo\nem 31/12/X0:\n\n ∙Disponibilidades: R$40.000\n ∙Contas a receber de clientes(420 dias): R$200.000\n ∙Perdas estimadas com crédito de liquidação duvidosa: R$10.000\n ∙Ajuste a valor presente a apropriar sobre Clientes: R$15.000\n ∙Veículo utilizado para entregas: R$80.000\n ∙Depreciação acumulada do veículo: R$20.000\n ∙Seguro do carro pago antecipadamente com apropriação mensal e linear por 24 meses:\n R$12.000\n\nAssinale a opção que indica o total do ativo circulante da entidade em 31/12/X0.", "alts": [["A", "R$21.000."], ["B", "R$30.000."], ["C", "R$40.000."], ["D", "R$46.000."], ["E", "R$55.000."]], "answer": "D", "resolution": "No circulante entram disponibilidades de 40.000 e a parcela do seguro antecipado apropriável nos próximos 12 meses: 12.000 ÷ 24 × 12 = 6.000. Total = R$ 46.000. Gabarito: D."}, {"n": 44, "header": "FGV - Aud (MPE AL)/MPE AL/2018", "stem": "O Balancete de uma entidade apresentava os seguintes saldos, em 31/12/2017:\n\n • Disponibilidades: R$ 50.000;\n • Estoques com previsão de vendas em 420 dias: R$ 80.000;\n • Clientes com vencimento em 390 dias: R$ 40.000;\n • Perdas estimadas com estoques: R$ 8.000;\n • Perdas estimadas com crédito de liquidação duvidosa de clientes: R$ 2.000;\n • Contas a receber pela venda de um terreno em 90 dias: R$ 60.000;\n • Veículo: R$ 50.000;\n • Seguro do veículo pago antecipadamente, em 01/01/2017, apropriado mensalmente de\n forma linear por dois anos: R$ 12.000;\n • Depreciação acumulada do veículo: R$ 10.000;\n • Perda por teste de recuperabilidade do veículo: R$ 5.000.\n\nAssinale a opção que indica o valor do ativo circulante no balanço patrimonial da entidade, em\n31/12/2017:", "alts": [["A", "R$ 110.000."], ["B", "R$ 116.000."], ["C", "R$ 121.000."], ["D", "R$ 154.000."], ["E", "R$ 188.000."]], "answer": "B", "resolution": "Ativo Circulante: disponibilidades 50.000 + conta a receber da venda do terreno em 90 dias 60.000 + saldo de seguro antecipado ainda a apropriar em 2018, R$ 6.000 = R$ 116.000. Gabarito: B."}, {"n": 45, "header": "FGV - Ana Esp (IMBEL)/IMBEL/Analista Contábil/2021", "stem": "Uma entidade apresentava os seguintes saldos em 31/12/X0:\n\n• Disponibilidades: R$ 50.000;\n• Despesas antecipadas: R$ 20.000;\n• Receitas recebidas antecipadamente: R$ 40.000;\n• Empréstimo concedido: R$ 50.000;\n• Ativo contingente: 18.000;\n• Estoque: R$ 30.000; • Imóveis: R$ 120.000.\n\nCom base nesses saldos, assinale a opção que indica o patrimônio líquido da entidade na data.", "alts": [["A", "R$ 130.000"], ["B", "R$ 190.000"], ["C", "R$ 230.000"], ["D", "R$ 248.000"], ["E", "R$ 270.000"]], "answer": "C", "resolution": "Ativos reconhecidos: disponibilidades 50.000 + despesas antecipadas 20.000 + empréstimo concedido 50.000 + estoque 30.000 + imóveis 120.000 = 270.000. Ativo contingente de 18.000 não é reconhecido. Passivo: receitas antecipadas 40.000. PL = 270.000 - 40.000 = R$ 230.000. Gabarito: C."}];
const qs=DATA; let i=0, mode='q', selected=null, locked=false, score=0;
const app=document.getElementById('screen'), prog=document.getElementById('progress');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){ const q=qs[i]; prog.textContent=`Questão ${i+1} de ${qs.length} • ${mode==='q'?'QUESTÃO':'RESOLUÇÃO'}`;
 if(mode==='q'){ app.innerHTML=`<div class="meta">${esc(q.header)}</div><div class="qtitle">QUESTÃO ${q.n}</div><div class="stem">${esc(q.stem)}</div><div id="alts">${q.alts.map(a=>`<button class="alt" data-l="${a[0]}"><b>${a[0]})</b> ${esc(a[1])}</button>`).join('')}</div><div id="fb" class="feedback"></div><button id="confirm" class="confirm" disabled>Confirmar Resposta</button>`;
  selected=null; locked=false; document.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{if(locked)return;selected=b.dataset.l;document.querySelectorAll('.alt').forEach(x=>x.classList.toggle('sel',x===b));document.getElementById('confirm').disabled=false}); document.getElementById('confirm').onclick=confirm;
 } else {app.innerHTML=`<div class="meta">${esc(q.header)}</div><div class="qtitle">RESOLUÇÃO • QUESTÃO ${q.n}</div><div class="gabarito">Gabarito: ${q.answer}</div><div class="resolution">${esc(q.resolution)}</div>`;} nav(); window.scrollTo(0,0)}
function confirm(){if(!selected||locked)return;locked=true; const q=qs[i], ok=selected===q.answer;if(ok)score++;document.querySelectorAll('.alt').forEach(b=>{if(b.dataset.l===q.answer)b.classList.add('correct');if(b.dataset.l===selected&&!ok)b.classList.add('wrong');b.disabled=true});let fb=document.getElementById('fb');fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'🟢 Resposta correta!':'🔴 Resposta incorreta. Veja a resolução na próxima tela.';document.getElementById('confirm').disabled=true;nav()}
function nav(){document.getElementById('prev').disabled=(i===0&&mode==='q');document.getElementById('next').textContent=mode==='q'?'Resolução →':(i===qs.length-1?'Finalizar':'Próxima →')}
document.getElementById('prev').onclick=()=>{if(mode==='r'){mode='q'}else if(i>0){i--;mode='r'}render()};
document.getElementById('next').onclick=()=>{if(mode==='q'){mode='r';render()}else if(i<qs.length-1){i++;mode='q';render()}else{prog.textContent='Concluído';app.innerHTML=`<div class="done"><h2>Quiz concluído!</h2><div class="score">Acertos: ${score} / ${qs.length}</div><p>Curso de Contabilidade Professor Moreira</p></div>`;document.getElementById('prev').disabled=false;document.getElementById('next').disabled=true}};
document.getElementById('restart').onclick=()=>{i=0;mode='q';score=0;document.getElementById('next').disabled=false;render()}; render();
</script></body></html>
